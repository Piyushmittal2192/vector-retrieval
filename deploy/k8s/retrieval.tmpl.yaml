# One color (blue or green) of the retrieval service, pinned to one index version.
# Rendered by ops/deploy.sh (ops/render.py fails if any placeholder is left unset).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: retrieval-${COLOR}
  namespace: search
  labels: {app: retrieval, color: ${COLOR}}
spec:
  replicas: ${REPLICAS}
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 600
  minReadySeconds: 5
  selector:
    matchLabels: {app: retrieval, color: ${COLOR}}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  template:
    metadata:
      labels: {app: retrieval, color: ${COLOR}, index-version: "${INDEX_VERSION}"}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
    spec:
      terminationGracePeriodSeconds: 60
      serviceAccountName: ${SERVICE_ACCOUNT}   # GKE: a KSA bound to GCS read access (Workload Identity)
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app: retrieval, color: ${COLOR}}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        - name: fetch-index
          image: ${IMAGE}
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "retrieval.fetch_index",
                    "--source", "${ARTIFACT_SOURCE}",
                    "--version", "${INDEX_VERSION}", "--dest", "/index"]
          resources:
            requests: {cpu: 250m, memory: 128Mi}
            limits: {cpu: "1", memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: index, mountPath: /index}
      containers:
        - name: retrieval
          image: ${IMAGE}
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8000}]
          env:
            - {name: INDEX_DIR, value: "/index/${INDEX_VERSION}"}
            - {name: POD_NAME, valueFrom: {fieldRef: {fieldPath: metadata.name}}}
            - {name: ENCODER_BACKEND, value: "${ENCODER_BACKEND}"}
            - {name: TORCH_THREADS, value: "${TORCH_THREADS}"}
            - {name: OMP_NUM_THREADS, value: "${TORCH_THREADS}"}
            - {name: MAX_BATCH, value: "${MAX_BATCH}"}
            - {name: MAX_WAIT_MS, value: "${MAX_WAIT_MS}"}
            - {name: MAX_QUEUE, value: "${MAX_QUEUE}"}
            - {name: REQUEST_TIMEOUT_MS, value: "${REQUEST_TIMEOUT_MS}"}
            - {name: QUERY_CACHE_SIZE, value: "${QUERY_CACHE_SIZE}"}
            - {name: EF, value: "${EF}"}
            - {name: HF_HOME, value: /tmp/hf}
          startupProbe:          # covers model + index load; liveness/readiness start after it passes
            httpGet: {path: /health, port: http}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:        # Service endpoints follow this
            httpGet: {path: /ready, port: http}
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:         # restart only if the process or worker is wedged
            httpGet: {path: /health, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ${PRESTOP_CMD}
          resources:
            requests: {cpu: "${CPU_REQUEST}", memory: "${MEMORY}"}
            limits: {cpu: "${CPU_LIMIT}", memory: "${MEMORY}"}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: index, mountPath: /index, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: index
          emptyDir: {sizeLimit: "${INDEX_DISK}"}
        - name: tmp
          emptyDir: {sizeLimit: 1Gi}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: retrieval-${COLOR}
  namespace: search
spec:
  maxUnavailable: 1
  selector:
    matchLabels: {app: retrieval, color: ${COLOR}}
---
# Direct, color-specific Service: for shadow tests and smoke tests of the
# idle color. User traffic goes through Service "retrieval" (service.yaml).
apiVersion: v1
kind: Service
metadata:
  name: retrieval-${COLOR}
  namespace: search
spec:
  selector: {app: retrieval, color: ${COLOR}}
  ports: [{name: http, port: 80, targetPort: http}]
